########
# Name #
########

name: airv2x_gaussian_0822_objfocal


############
# Training #
############

active_sensors: &active_sensors ["cam"]
collaborators: &collaborators ["vehicle", "rsu", "drone"]
ego_type: &ego_type vehicle
bevcam_fov: 110

yaml_parser: "load_airv2x_params"
train_params:
  batch_size: &batch_size 1
  epoches: 50
  eval_freq: 2
  save_freq: 1
  max_cav: &max_cav
    vehicle: 3
    rsu: 2
    drone: 2

device: &device cuda
train: &train True


###########
# Dataset #
###########

root_dir: '/mnt/home/suyi/AirV2X-Perception/train/train'
validate_dir: '/mnt/home/suyi/AirV2X-Perception/val/val'
test_dir: '/mnt/home/suyi/AirV2X-Perception/test'
num_class: &num_class 7
num_anchor: &num_anchor 2

task: &task "det"
seg_branch: &seg_branch "both"
seg_hw: &seg_hw 512
seg_res: &seg_res 0.25
dynamic_class: &dynamic_class 7
static_class: &static_class 3

fusion:
  core_method: 'IntermediateFusionDatasetAirv2x'
  args:
    proj_first: &proj_first true
    veh_grid_conf: &veh_grid_conf
      xbound: [-140.8, 140.8, 0.4]
      ybound: [-40, 40, 0.4]
      zbound: [-10, 10, 20.0]
      ddiscr: [0, 50, 50]
      mode: 'LID'
    veh_data_aug_conf: &veh_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [0, 0]
      H: 720
      W: 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]

    rsu_grid_conf: &rsu_grid_conf
      xbound: [-140.8, 140.8, 0.4]
      ybound: [-40, 40, 0.4]
      zbound: [-30, 30, 60.0]
      ddiscr: [2, 50, 48]
      mode: 'LID'
    rsu_data_aug_conf: &rsu_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [0, 0]
      H: 720
      W: 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]

    drone_grid_conf: &drone_grid_conf
      xbound: [-140.8, 140.8, 0.4]
      ybound: [-40, 40, 0.4]
      zbound: [-150, -6, 144]
      ddiscr: [6, 150, 144]
      mode: 'UD'
    drone_data_aug_conf: &drone_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [-3.6, 3.6]
      H: 720
      W: 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

preprocess:
  core_method: 'SpVoxelPreprocessor'
  ego_type: *ego_type
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]

POINT_CLOUD_RANGE: *cav_lidar

postprocess:
  core_method: 'VoxelPostprocessor'
  ego_type: *ego_type
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: *num_anchor
  target_args:
    pos_threshold: 0.60
    neg_threshold: 0.45
    score_threshold: 0.20
    obj_threshold: 0.20
  order: 'hwl'
  max_num: 300
  nms_thresh: 0.15


#########
# Model #
#########

model:
  core_method: airv2x_gaussian_0822
  args:
    ego_type: *ego_type
    collaborators: *collaborators
    active_sensors: *active_sensors
    max_cav: *max_cav
    device: *device
    train: *train
    proj_first: *proj_first
    supervise_single: False
    backbone_fix: False
    heatmap_num_classes: 2
    # false: Vehicle P1 at 90x160, load `pretrained`.
    # true:  Vehicle P1 at 45x80, load `pretrained_v45` (RSU/Drone stay 90x160).
    vehicle_p1_v45: true
    pretrained: '/mnt/home/suyi/AirV2X-Perception_gaussian/opencood/logs/airv2x_gaussian_final/net_final_branch.pth'
    pretrained_v45: '/mnt/home/suyi/AirV2X-Perception_gaussian/opencood/logs/airv2x_gaussian_final/net_final_branch_v45.pth'

    vehicle:
      modalities: ["cam"]
      lidar:
        voxel_size: &veh_voxel_size [0.4, 0.4, 4]
        lidar_range: &veh_lidar [-140.8, -40, -3, 140.8, 40, 1]
        compression: 0
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      cam:
        grid_conf: *veh_grid_conf
        data_aug_conf: *veh_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: false
        depth_supervision: false

    rsu:
      modalities: ["cam"]
      lidar:
        voxel_size: &rsu_voxel_size [0.4, 0.4, 60]
        lidar_range: &rsu_lidar [-140.8, -40, -30, 140.8, 40, 30]
        compression: 0
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      cam:
        grid_conf: *rsu_grid_conf
        data_aug_conf: *rsu_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: false
        depth_supervision: false

    drone:
      modalities: ["cam"]
      lidar:
        voxel_size: &drone_voxel_size [0.4, 0.4, 144]
        lidar_range: &drone_lidar [-140.8, -40, -150, 140.8, 40, -6]
        compression: 0
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      cam:
        grid_conf: *drone_grid_conf
        data_aug_conf: *drone_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: false
        depth_supervision: false

    modality_fusion:
      base_bev_backbone:
        layer_nums: [3, 5, 8]
        layer_strides: [2, 2, 2]
        num_filters: [64, 128, 256]
        upsample_strides: [1, 2, 4]
        num_upsample_filter: [128, 128, 128]

      shrink_header:
        use: true
        input_dim: 384
        dim: [ &out_channels 256 ]
        kernal_size: [ 1 ]
        stride: [ 1 ]
        padding: [ 0 ]

      compression: 0

    task: *task
    seg_branch: *seg_branch
    seg_hw: *seg_hw
    head_dim: 256
    outC: *out_channels
    anchor_number: *num_anchor
    num_class: *num_class
    dynamic_class: *dynamic_class
    static_class: *static_class
    cav_range: *cav_lidar
    seg_res: *seg_res
    obj_head: true
    # Fresh-run prior for the obj_head bias (logit = log(p/(1-p))).
    obj_prior_prob: 0.01

    gaussian_range_filter:
      enabled: true

    gaussian_refinement:
      enabled: true
      geometry:
        input_dim: 10
        geo_dim: 64
      fusion:
        hidden_dim: 256
      agents:
        vehicle:
          unit_xyz: [2.0, 2.0, 1.0]
        rsu:
          unit_xyz: [2.0, 2.0, 1.0]
        drone:
          unit_xyz: [1.0, 1.0, 1.0]
      scale:
        # log-scale residual range. Head logit 0 → δ=0 → multiplier 1.
        delta_range: [-0.20, 0.05]
      rotation:
        max_angle: 0.2

    gaussian_attention:
      heads: 4
      ffn_dim: 256
      stage1_layers: 2
      stage2_layers: 2
      stage3_self_layers: 1
      stage3_cross_layers: 1

    gaussian_stage3:
      voxel_size: [0.4, 0.4, 0.125] 
      point_cloud_range: *cav_lidar
      adapter_bottleneck: 64
      bev_n_sigma: 3.0


##################
# Loss Functions #
##################

loss:
  det:
    core_method: point_pillar_loss_multiclass
    args:
      cls_weight: 1.0
      # Focal alpha/gamma for the cls (psm) branch (unchanged).
      alpha: 0.25
      gamma: 2.0
      # Objectness binary focal loss (separate alpha/gamma from cls).
      obj_weight: 1.0
      obj_alpha: 0.25
      obj_gamma: 2.0
      reg: 2.0
      iou_weight: 0.5
      num_class: *num_class


###########
# Learner #
###########

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 25, 40]
