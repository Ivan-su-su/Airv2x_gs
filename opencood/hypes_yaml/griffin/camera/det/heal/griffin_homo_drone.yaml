name: griffin_homo_drone

active_sensors: &active_sensors ["cam"]
collaborators: &collaborators ["drone"]
ego_type: &ego_type drone
yaml_parser: "load_voxel_params"

train_params:
  batch_size: 1
  epoches: 50
  eval_freq: 2
  save_freq: 1
  max_cav:
    vehicle: 0
    rsu: 0
    drone: 1

root_dir: '/mnt/home/suyi/Griffin/datasets/griffin_50scenes_55m/griffin-release'
validate_dir: '/mnt/home/suyi/Griffin/datasets/griffin_50scenes_55m/griffin-release'
test_dir: '/mnt/home/suyi/Griffin/datasets/griffin_50scenes_55m/griffin-release'

griffin:
  split_json: '/mnt/home/suyi/Griffin/data/split_datas/griffin_50scenes_55m.json'
  final_dim: [360, 640]
  image_scale: 0.5
  drone_stride: 4
  ground_z: 0.0
  max_ideal_depth: 150.0
  photometric_distortion: false

num_class: &num_class 4
num_anchor: &num_anchor 6
task: &task "det"

fusion:
  core_method: 'GriffinHomoDroneDataset'
  args:
    proj_first: true

data_augment: []

preprocess:
  core_method: 'SpVoxelPreprocessor'
  ego_type: *ego_type
  args:
    # xy matches the Griffin drone LSS grid (0.4 m). z span is the LSS
    # zbound width so anchor D stays 1.
    voxel_size: &voxel_size [0.4, 0.4, 15.0]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  # Drone-local range. xy is the current Griffin LSS BEV. z is the current
  # Griffin drone LSS z voxel, which also covers the bulk of drone-local
  # box centers (train in-xy z median about -54.8 m).
  cav_lidar_range: &cav_lidar [-51.2, -51.2, -65.0, 51.2, 51.2, -50.0]

POINT_CLOUD_RANGE: *cav_lidar

postprocess:
  core_method: 'VoxelPostprocessor'
  ego_type: *ego_type
  anchor_args:
    cav_lidar_range: *cav_lidar
    sizes: auto_griffin_train_median
    r: [0, 90]
    feature_stride: 2
    num: *num_anchor
    num_class: *num_class
  target_args:
    pos_threshold: 0.60
    neg_threshold: 0.45
    score_threshold: 0.20
    obj_threshold: 0.20
  order: 'hwl'
  max_num: 300
  nms_thresh: 0.15

model:
  core_method: griffin_homo_base
  args:
    ego_type: *ego_type
    collaborators: *collaborators
    homo_agent_type: drone
    active_sensors: *active_sensors
    max_cav:
      vehicle: 0
      rsu: 0
      drone: 1
    device: cuda
    train: true
    proj_first: true
    supervise_single: false

    p1_checkpoint: '/mnt/home/suyi/AirV2X-Perception_gaussian/opencood/logs/griffin_gaussian_p1_v45_scratch50_aug/best.pth'
    freeze_lss: false
    freeze_bev_backbone: false
    freeze_fusion: false
    freeze_heads: false

    drone:
      modalities: ["cam"]
      cam:
        grid_conf:
          xbound: [-51.2, 51.2, 0.4]
          ybound: [-51.2, 51.2, 0.4]
          zbound: [-65.0, -50.0, 15.0]
          ddiscr: [6, 150, 144]
          mode: 'UD'
        data_aug_conf:
          final_dim: [360, 640]
        img_downsample: 4
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: false
        depth_supervision: false
        lift: ideal_ground
        feature_sample_mode: cell_center

    modality_fusion:
      base_bev_backbone:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      shrink_header:
        use: true
        input_dim: 384
        dim: [256]
        kernal_size: [1]
        stride: [1]
        padding: [0]
      compression: 0

    fusion_backbone:
      resnext: true
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *num_anchor

    task: *task
    in_head: 256
    anchor_number: *num_anchor
    num_class: *num_class
    cav_range: *cav_lidar
    obj_head: true

loss:
  det:
    core_method: point_pillar_loss_multiclass
    args:
      cls_weight: 1.0
      alpha: 0.25
      gamma: 2.0
      obj_weight: 2.0
      obj_alpha: 0.5
      obj_gamma: 2.0
      iou_weight: 0.5
      reg: 2.0
      num_class: *num_class

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1.0e-10
    weight_decay: 1.0e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 25, 40]
