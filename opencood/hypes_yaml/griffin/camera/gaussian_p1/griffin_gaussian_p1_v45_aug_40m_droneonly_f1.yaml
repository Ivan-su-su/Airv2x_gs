name: griffin_gaussian_p1_v45_aug_40m
dataset:
  root: /mnt/home/suyi/Griffin/datasets/griffin_50scenes_40m/griffin-release
  split_json: /mnt/home/suyi/Griffin/data/split_datas/griffin_50scenes_40m.json
  final_dim:
  - 360
  - 640
  vehicle_stride: 8
  drone_stride: 4
  lidar_num_features: 4
  mask_foreground_mode: carla_semantic
  target_semantic_tags:
  - 12
  - 14
  - 15
  - 16
  - 18
  - 19
  max_mask_foreground_ratio: 0.98
  # No photometric distortion (user request).
  photometric_distortion: false
  # Each official val scene: 30% of frames join train, 70% stay val-only.
  val_frame_train_fraction: 0.3
  val_frame_split_seed: 20260921
  # Griffin RandomScaleImageMultiViewImage(scales=[0.5]); train/val same scale.
  griffin_image_scale: 0.5
  seed: 20260918
model:
  heatmap_num_classes: 2
  vehicle:
    cam:
      grid_conf:
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -5
        - 3
        - 8.0
        ddiscr:
        - 0
        - 50
        - 50
        mode: LID
      data_aug_conf:
        final_dim:
        - 360
        - 640
      img_downsample: 8
      img_features: 64
      use_depth_gt: false
      depth_supervision: true
  drone:
    cam:
      grid_conf:
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -65
        - -50
        - 15.0
        ddiscr:
        - 6
        - 150
        - 144
        mode: UD
      data_aug_conf:
        final_dim:
        - 360
        - 640
      img_downsample: 8
      img_features: 64
      use_depth_gt: false
      depth_supervision: false
loss:
  heatmap_gamma: 2.0
  # fg-class weight for the 2-class softmax focal (bg gets 1-alpha).
  # REMOVED (was 0.75): up-weighting fg pushed the whole probability map
  # up (bg cells fire at 0.3-0.6), degrading the 0.3 gate. Matches the 55m
  # run, which has no alpha_fg and a clean gate (prec 0.877, 260 fires/fr).
  # heatmap_alpha_fg: null
  vehicle_heatmap_weight: 1.0
  drone_heatmap_weight: 1.0
  vehicle_depth_weight: 1.0
depth_loss:
  alpha: 0.25
  gamma: 2.0
  smooth_target: false
  metric_lambda: 0.3
optimizer:
  trunk_lr: 0.0002
  feature_lr: 0.002
  head_lr: 0.002
  eps: 1.0e-10
  weight_decay: 0.0001
train:
  output_dir: opencood/logs/griffin_gaussian_p1_v45_aug_40m_droneonly_f1
  # 50 (was 30): train into the converged regime; the 40m run stopped at
  # ep30 before the ep-40 LR drop and before precision matured (55m needed
  # ~20+ epochs to reach prec>0.84).
  epochs: 50
  batch_size: 2
  workers: 8
  amp: true
  grad_clip: 10.0
  save_every: 5
lr_scheduler:
  milestones:
  - 10
  - 25
  - 40
  gamma: 0.1
