########
# Shared camera-det settings for AirV2X homogeneous / HEAL / STAMP / NegoCollab
# Child YAMLs inherit this file via `inherit_from` + load_airv2x_heter_params.
########

name: airv2x_camera_det_shared

active_sensors: &active_sensors ["cam"]
collaborators: &collaborators ["vehicle", "rsu", "drone"]
ego_type: &ego_type vehicle
bevcam_fov: 110

train_params:
  batch_size: &batch_size 2
  epoches: 50
  eval_freq: 2
  save_freq: 1
  max_cav: &max_cav
    vehicle: 3
    rsu: 2
    drone: 2

device: &device cuda
train: &train True

root_dir: 'dataset/airv2x/train'
validate_dir: 'dataset/airv2x/val'
test_dir: 'dataset/airv2x/test'
num_class: &num_class 7
num_anchor: &num_anchor 2

task: &task "det"
seg_branch: &seg_branch "both"
seg_hw: &seg_hw 512
seg_res: &seg_res 0.25
dynamic_class: &dynamic_class 7
static_class: &static_class 3

fusion:
  core_method: 'IntermediateFusionDatasetAirv2x'
  args:
    proj_first: &proj_first true
    veh_grid_conf: &veh_grid_conf
      xbound: [-140.8, 140.8, 0.4]
      ybound: [-40, 40, 0.4]
      zbound: [-10, 10, 20.0]
      ddiscr: [2, 50, 48]
      mode: 'LID'
    veh_data_aug_conf: &veh_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [0, 0]
      H: 720
      W: 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]
    rsu_grid_conf: &rsu_grid_conf
      xbound: [-140.8, 140.8, 0.4]
      ybound: [-40, 40, 0.4]
      zbound: [-30, 30, 60.0]
      ddiscr: [2, 50, 48]
      mode: 'LID'
    rsu_data_aug_conf: &rsu_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [0, 0]
      H: 720
      W: 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]
    drone_grid_conf: &drone_grid_conf
      xbound: [-140.8, 140.8, 0.4]
      ybound: [-40, 40, 0.4]
      zbound: [-150, -6, 144]
      ddiscr: [6, 150, 144]
      mode: 'UD'
    drone_data_aug_conf: &drone_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [-3.6, 3.6]
      H: 720
      W: 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

preprocess:
  core_method: 'SpVoxelPreprocessor'
  ego_type: *ego_type
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]

postprocess:
  core_method: 'VoxelPostprocessor'
  ego_type: *ego_type
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: *num_anchor
  target_args:
    pos_threshold: 0.60
    neg_threshold: 0.45
    score_threshold: 0.20
    obj_threshold: 0.20
  order: 'hwl'
  max_num: 300
  nms_thresh: 0.15

model:
  core_method: airv2x_homo_base
  args:
    collaborators: *collaborators
    active_sensors: *active_sensors
    device: *device
    train: *train
    proj_first: *proj_first
    supervise_single: False
    freeze_lss: true
    freeze_bev_backbone: false
    freeze_fusion: false
    freeze_heads: false
    assembled_inference: false
    vehicle:
      modalities: ["cam"]
      lidar:
        voxel_size: &veh_voxel_size [0.4, 0.4, 4]
        lidar_range: &veh_lidar [-140.8, -40, -3, 140.8, 40, 1]
        compression: 0
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      cam:
        grid_conf: *veh_grid_conf
        data_aug_conf: *veh_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: true
        depth_supervision: false
    rsu:
      modalities: ["cam"]
      lidar:
        voxel_size: &rsu_voxel_size [0.4, 0.4, 60]
        lidar_range: &rsu_lidar [-140.8, -40, -30, 140.8, 40, 30]
        compression: 0
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      cam:
        grid_conf: *rsu_grid_conf
        data_aug_conf: *rsu_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: true
        depth_supervision: false
    drone:
      modalities: ["cam"]
      lidar:
        voxel_size: &drone_voxel_size [0.4, 0.4, 144]
        lidar_range: &drone_lidar [-140.8, -40, -150, 140.8, 40, -6]
        compression: 0
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      cam:
        grid_conf: *drone_grid_conf
        data_aug_conf: *drone_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: true
        depth_supervision: false
    modality_fusion:
      base_bev_backbone:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      compression: 0
      shrink_header:
        use: true
        kernal_size: [ 3 ]
        stride: [ 1 ]
        padding: [ 1 ]
        dim: [ 256 ]
        input_dim: 384
    fusion_backbone:
      resnext: true
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *num_anchor
    task: *task
    seg_branch: *seg_branch
    seg_hw: *seg_hw
    in_head: 256
    anchor_number: *num_anchor
    num_class: *num_class
    dynamic_class: *dynamic_class
    static_class: *static_class
    cav_range: *cav_lidar
    seg_res: *seg_res
    obj_head: true

loss:
  det:
    core_method: point_pillar_loss_multiclass
    args:
      cls_weight: 1.0
      reg: 2.0
      num_class: *num_class
  seg:
    core_method: vanilla_seg_loss
    args:
      seg_branch: *seg_branch
      d_weights: [200.0, 200.0, 75.0, 200.0, 200.0, 200.0]
      s_weights: 50.0
      l_weights: 8.0
      d_coe: 2.0
      s_coe: 0.0

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 25]
