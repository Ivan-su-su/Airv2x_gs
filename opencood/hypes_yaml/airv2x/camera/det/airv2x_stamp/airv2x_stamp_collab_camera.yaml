# AirV2X STAMP adapter training. Reuses the three shared Stage-0 bases.
# Do NOT train stamp/single/*.yaml as independent bases.
inherit_from: opencood/hypes_yaml/airv2x/camera/det/_shared_camera_det.yaml
yaml_parser: "load_airv2x_heter_params"

name: airv2x_stamp_collab_camera
collaborators: ["vehicle", "rsu", "drone"]
ego_type: vehicle

train_params:
  max_cav:
    vehicle: 3
    rsu: 2
    drone: 2

model:
  core_method: airv2x_stamp
  args:
    collaborators: ["vehicle", "rsu", "drone"]
    freeze_lss: true
    freeze_bev_backbone: true
    freeze_fusion: true
    freeze_heads: true
    vehicle:
      adapter:
        core_method: identity
        args:
          in_channels: 64
          out_channels: 64
          in_cav_lidar_range: [-140.8, -40, -3, 140.8, 40, 1]
          out_cav_lidar_range: [-140.8, -40, -3, 140.8, 40, 1]
          in_feature_shape: [128, 128]
          out_feature_shape: [128, 128]
    rsu:
      adapter:
        core_method: adapterconvnext
        args:
          in_channels: 64
          out_channels: 64
          in_cav_lidar_range: [-140.8, -40, -3, 140.8, 40, 1]
          out_cav_lidar_range: [-140.8, -40, -30, 140.8, 40, 30]
          in_feature_shape: [128, 128]
          out_feature_shape: [128, 128]
          submodule_args:
            num_of_blocks: 3
            dim: 64
    drone:
      adapter:
        core_method: adapterconvnext
        args:
          in_channels: 64
          out_channels: 64
          in_cav_lidar_range: [-140.8, -40, -3, 140.8, 40, 1]
          out_cav_lidar_range: [-140.8, -40, -150, 140.8, 40, -6]
          in_feature_shape: [128, 128]
          out_feature_shape: [128, 128]
          submodule_args:
            num_of_blocks: 3
            dim: 64
