########
# Name #
########

name: airv2x_gaussian_p1_joint

############
# Training #
############

# Single joint P1 architecture: Heatmap + Depth share F90 per agent.
# There is no p1_task / H-only / D-only / R45 selector.
# EfficientNet-B0 ImageNet weights are loaded by official
# CamEncode → EfficientNet.from_pretrained("efficientnet-b0"), not here.

active_sensors: &active_sensors ["cam"]
collaborators: &collaborators ["vehicle", "rsu", "drone"]
ego_type: &ego_type vehicle
bevcam_fov: 110

yaml_parser: "load_airv2x_params" # add support for airv2x
train_params:
  batch_size: &batch_size 1
  epoches: 50
  eval_freq: 2
  save_freq: 1
  max_cav: &max_cav
    vehicle: 5
    rsu: 5
    drone: 5

device: &device cuda
train: &train True


###########
# Dataset #
###########
# Dataset/parser still preprocess LiDAR metadata because
# IntermediateFusionDatasetAirv2x / load_airv2x_params require these fields.
# The P1 MODEL does not consume LiDAR.

root_dir: '/home/dell/suyi/AirV2X-Perception/train/train'
validate_dir: '/home/dell/suyi/AirV2X-Perception/val/val'
test_dir: '/home/dell/suyi/AirV2X-Perception/test/test'
num_class: &num_class 7
num_anchor: &num_anchor 2

seg_branch: &seg_branch "both"
seg_hw: &seg_hw 512 # resolution of the segmentation map
seg_res: &seg_res 0.25
dynamic_class: &dynamic_class 7
static_class: &static_class 3

fusion:
  core_method: 'IntermediateFusionDatasetAirv2x' # LateFusionDataset, EarlyFusionDataset, IntermediateFusionDataset supported
  args:
    proj_first: &proj_first true
    veh_grid_conf: &veh_grid_conf
      xbound: [-140.8, 140.8, 0.4]    
      ybound: [-40, 40, 0.4]  
      zbound: [-10, 10, 20.0] 
      ddiscr: [0, 50, 50]
      mode: 'LID'
    veh_data_aug_conf: &veh_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [0, 0]
      H: 720 # 720
      W: 1280 # 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]
    
    rsu_grid_conf: &rsu_grid_conf
      xbound: [-140.8, 140.8, 0.4]  
      ybound: [-40, 40, 0.4] 
      zbound: [-30, 30, 60.0] 
      ddiscr: [2, 50, 48]
      mode: 'LID'
    rsu_data_aug_conf: &rsu_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [0, 0]
      H: 720 # 720
      W: 1280 # 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]

    drone_grid_conf: &drone_grid_conf
      xbound: [-140.8, 140.8, 0.4]  
      ybound: [-40, 40, 0.4] 
      zbound: [-150, -6, 144] 
      ddiscr: [6, 150, 144]
      mode: 'UD'
    drone_data_aug_conf: &drone_data_aug_conf_image
      resize_lim: [0.65, 0.7]
      final_dim: [360, 640]
      rot_lim: [-3.6, 3.6]
      H: 720 # 720
      W: 1280 # 1280
      rand_flip: False
      bot_pct_lim: [0.0, 0.05]
    
# Note: data augmentation is not used for intermediate fusion, but we still keep the data augmentation config for consistency.
data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

# preprocess-related
preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  ego_type: *ego_type
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4] # Use ego type
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  # lidar range for each agent
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1] # Use ego type
POINT_CLOUD_RANGE: *cav_lidar  # required by IntermediateFusionDatasetAirv2x    

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  ego_type: *ego_type
  anchor_args:
    cav_lidar_range: *cav_lidar # Note: Use ego type
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: *num_anchor
  target_args:
    pos_threshold: 0.60
    neg_threshold: 0.45
    score_threshold: 0.20
    obj_threshold: 0.20
  order: 'hwl' # hwl or lwh
  max_num: 300 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15


#########
# Model #
#########

# model related
model:
  core_method: airv2x_gaussian_0822
  args:
    ego_type: *ego_type
    collaborators: *collaborators
    active_sensors: *active_sensors
    max_cav: *max_cav
    device: *device
    train: *train
    proj_first: *proj_first
    supervise_single: False
    backbone_fix: False
    num_class: *num_class
    # P1 HeatmapHead channels. Dataset num_class remains 7 for parser fields.
    heatmap_num_classes: 2
    BACKBONE_2D:
      LOAD_IMAGE_SEMANTIC_GT: true

    ###################
    # Vehicular Agent #
    ###################
    vehicle:
      modalities: ["cam"]  # "cam", "lidar"

      lidar:
        voxel_size: &veh_voxel_size [0.4, 0.4, 4]
        lidar_range: &veh_lidar [-140.8, -40, -3, 140.8, 40, 1]
        compression: 0 # compression rate
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64

      cam:
        grid_conf: *veh_grid_conf
        data_aug_conf: *veh_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: false
        depth_supervision: true
    
    ###################
    # Road Side Units #
    ###################

    rsu:
      modalities: ["cam"]  # "cam", "lidar"

      lidar:
        voxel_size: &rsu_voxel_size [0.4, 0.4, 60]
        lidar_range: &rsu_lidar [-140.8, -40, -30, 140.8, 40, 30]
        compression: 0 # compression rate
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64

      cam:
        grid_conf: *rsu_grid_conf
        data_aug_conf: *rsu_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: false
        depth_supervision: true

    ######################
    # UAV (Drone) Agents #
    ######################

    drone:
      modalities: ["cam"]  # "cam", "lidar"

      lidar:
        voxel_size: &drone_voxel_size [0.4, 0.4, 144]
        lidar_range: &drone_lidar [-140.8, -40, -150, 140.8, 40, -6]
        compression: 0 # compression rate
        backbone_fix: false
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64

      cam:
        grid_conf: *drone_grid_conf
        data_aug_conf: *drone_data_aug_conf_image
        img_downsample: 8
        img_features: 64
        bevout_feature: 64
        camera_encoder: EfficientNet
        use_depth_gt: false
        depth_supervision: true
      
    # params for modality fusion
    modality_fusion:
      base_bev_backbone:
        layer_nums: &layer_nums [3, 5, 8]
        layer_strides: [2, 2, 2]
        num_filters: &num_filters [64, 128, 256]
        upsample_strides: [1, 2, 4]
        num_upsample_filter: [128, 128, 128]
      
      shrink_header:
        use: true 
        input_dim: 384  # 128 * 3
        dim: [ &out_channels 256 ] 
        kernal_size: [ 1 ] 
        stride: [ 1 ]
        padding: [ 0 ]
      
      compression: 0  # Compression rate

      # params for collaborative fusion: where2comm
    where2com_fusion:
      fully: false
      voxel_size: *voxel_size
      downsample_rate: 4
      in_channels: 256
      multi_scale: true
      layer_nums: *layer_nums
      num_filters: *num_filters
      communication:
        round: 1
        threshold: 0.01
        gaussian_smooth:
          k_size: 5
          c_sigma: 1.0

    # leftover camera-det fields kept for parser/dataset; P1 model ignores them
    seg_branch: *seg_branch
    seg_hw: *seg_hw
    head_dim: 256
    outC: *out_channels
    anchor_number: *num_anchor
    num_class: *num_class
    dynamic_class: *dynamic_class
    static_class: *static_class
    cav_range: *cav_lidar
    seg_res: *seg_res
    obj_head: true


##################
# Loss Functions #
##################
# Trainer computes total_loss = heatmap_loss + depth_loss and calls
# total_loss.backward() once. No adaptive weighting.
# Heatmap is 2-class softmax Focal (gamma=2, no alpha). Do not resume a
# 7-class HeatmapHead checkpoint into this experiment.

loss:
  heatmap:
    args:
      gamma: 2.0
  depth:
    args:
      alpha: 0.25
      gamma: 2.0
      smooth_target: false


###########
# Learner #
###########

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [10, 25, 40]
